name: Synthetic security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Synthetic tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: ubuntu-24.04
            python: "3.12"
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.9
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run --no-sync python -m pytest -q

  review:
    name: Static checks, UI and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.9 ruff==0.17.6
      - run: ruff check .
      - run: node --test tests/ui-security.test.cjs
      - name: Audit the complete lockfile (including Windows and development dependencies)
        run: uv audit --locked
