[build-system]
requires = ["uv_build==0.13.9"]
build-backend = "uv_build"

[project]
name = "outlook-classic-mcp"
version = "0.3.3"
description = "Local MCP server for classic Outlook desktop on Windows (COM, no Azure app required)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anas Shaikh" }]
keywords = ["mcp", "outlook", "model-context-protocol", "claude", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Email",
  "Topic :: Office/Business",
]
dependencies = [
  "mcp==1.30.0",  # Reviewed 1.x SDK for both STDIO discovery and direct calls.
  "pydantic>=2.6",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["build>=1.0", "twine>=5.0", "pytest>=8.0"]

[project.scripts]
outlook-mcp = "outlook_mcp.entrypoint:main"

[project.urls]
Homepage = "https://github.com/scepbjoern/Outlook-Classic-MCP"
Issues = "https://github.com/scepbjoern/Outlook-Classic-MCP/issues"

[tool.uv.build-backend]
module-name = "outlook_mcp"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Repository-wide whitespace, invalid code, unsafe evaluation, loaders and shell use.
select = ["E101", "W191", "W291", "W292", "W293", "E9", "F63", "F7", "F82", "S102", "S307", "S506", "S602", "S608"]
